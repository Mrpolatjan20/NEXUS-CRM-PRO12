name: NEXUS CRM Face Module Build Check

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-face-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download MobileFaceNet model
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          curl -fL --retry 3 \
            "https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/mobile_facenet/releases/v0.65.0/mobile_facenet-tflite-float.zip" \
            -o "$RUNNER_TEMP/mobile_facenet.zip"
          unzip -o "$RUNNER_TEMP/mobile_facenet.zip" -d "$RUNNER_TEMP/mobile_facenet"
          MODEL="$(find "$RUNNER_TEMP/mobile_facenet" -type f -name '*.tflite' | head -n 1)"
          test -n "$MODEL"
          cp "$MODEL" android/app/src/main/assets/mobilefacenet.tflite
          test -s android/app/src/main/assets/mobilefacenet.tflite

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-CRM-Face-Module-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
