name: NEXUS CRM Face Module Build Check

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-face-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download and inspect MobileFaceNet model
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          curl -fL --retry 3 \
            "https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/mobile_facenet/releases/v0.65.0/mobile_facenet-tflite-float.zip" \
            -o "$RUNNER_TEMP/mobile_facenet.zip"
          unzip -o "$RUNNER_TEMP/mobile_facenet.zip" -d "$RUNNER_TEMP/mobile_facenet"
          python -m pip install --quiet tflite
          python - <<'PY'
          import glob, os, sys
          import tflite

          files = glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "mobile_facenet", "**", "*.tflite"), recursive=True)
          if not files:
              print("ERROR: ZIP ichida .tflite fayl topilmadi.", file=sys.stderr)
              sys.exit(1)

          for path in files:
              print("\\nMODEL:", path)
              data = open(path, "rb").read()
              model = tflite.Model.GetRootAsModel(data, 0)
              for sg in range(model.SubgraphsLength()):
                  graph = model.Subgraphs(sg)
                  print("SUBGRAPH:", sg)
                  print("INPUT TENSORS:")
                  for i in range(graph.InputsLength()):
                      idx = int(graph.Inputs(i))
                      tensor = graph.Tensors(idx)
                      print("  index=", idx, "name=", tensor.Name(), "type=", tensor.Type(), "shape=", tensor.ShapeAsNumpy().tolist())
                  print("OUTPUT TENSORS:")
                  for i in range(graph.OutputsLength()):
                      idx = int(graph.Outputs(i))
                      tensor = graph.Tensors(idx)
                      print("  index=", idx, "name=", tensor.Name(), "type=", tensor.Type(), "shape=", tensor.ShapeAsNumpy().tolist())
          print("\\nDIAGNOSTIKA TUGADI. Tensor ma'lumotlariga qarab keyingi bosqich moslanadi.")
          PY

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-CRM-Face-Module-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
