
name: Mrpolatjan CRM Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android files
        run: |
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/uz/nexus/crm/MainActivity.kt

      - name: Build APK
        run: gradle -p android :app:assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Mrpolatjan-CRM.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mrpolatjan-CRM-APK
          path: android/app/build/outputs/apk/debug/Mrpolatjan-CRM.apk
          if-no-files-found: error
