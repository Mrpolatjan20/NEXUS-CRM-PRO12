name: NEXUS CRM Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Ilova versiyasi, masalan 1.0.1"
        required: true
        default: "1.0.1"
      version_code:
        description: "Android versionCode (har safar oshiring)"
        required: true
        default: "2"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/nexus-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Download and validate MobileFaceNet model
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          curl -fL --retry 3 \
            "https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/mobile_facenet/releases/v0.65.0/mobile_facenet-tflite-float.zip" \
            -o "$RUNNER_TEMP/mobile_facenet.zip"
          unzip -o "$RUNNER_TEMP/mobile_facenet.zip" -d "$RUNNER_TEMP/mobile_facenet"
          python -m pip install --quiet tflite
          MODEL="$(python - <<'PY'
          import glob, os, sys
          import tflite

          files = glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "mobile_facenet", "**", "*.tflite"), recursive=True)
          for path in files:
              try:
                  data = open(path, "rb").read()
                  model = tflite.Model.GetRootAsModel(data, 0)
                  graph = model.Subgraphs(0)
                  input_index = int(graph.Inputs(0))
                  output_index = int(graph.Outputs(0))
                  input_tensor = graph.Tensors(input_index)
                  output_tensor = graph.Tensors(output_index)
                  input_shape = input_tensor.ShapeAsNumpy().tolist()
                  output_shape = output_tensor.ShapeAsNumpy().tolist()
                  if (input_tensor.Type() == tflite.TensorType.FLOAT32
                      and input_shape == [1, 112, 112, 3]
                      and output_tensor.Type() == tflite.TensorType.FLOAT32
                      and output_shape == [1, 128]):
                      print(path)
                      sys.exit(0)
              except Exception:
                  continue
          print("ERROR: ZIP ichida FLOAT32 [1,112,112,3] input va [1,128] output model topilmadi.", file=sys.stderr)
          sys.exit(1)
          PY
          )"
          echo "Tanlangan MobileFaceNet: $MODEL"
          cp "$MODEL" android/app/src/main/assets/mobilefacenet.tflite
          test -s android/app/src/main/assets/mobilefacenet.tflite

      - name: Build signed release APK
        run: |
          gradle -p android :app:assembleRelease \
            -PVERSION_NAME="${{ inputs.version_name }}" \
            -PVERSION_CODE="${{ inputs.version_code }}"
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Mrpolatjan-CRM.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-CRM-Release-APK
          path: release/Mrpolatjan-CRM.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: NEXUS CRM v${{ inputs.version_name }}
          files: release/Mrpolatjan-CRM.apk
          make_latest: true
